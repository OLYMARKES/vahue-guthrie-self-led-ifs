<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Week 1 student material · UX prototypes</title>
  <style>
    :root {
      --page: #f6f7f9;
      --surface: #ffffff;
      --surface-subtle: #f7f8fa;
      --ink: #172033;
      --ink-soft: #4d576b;
      --muted: #687184;
      --line: #e3e7ed;
      --line-strong: #ced5df;
      --accent: #315fcb;
      --accent-hover: #244fae;
      --accent-soft: #edf3ff;
      --success: #287a55;
      --success-soft: #edf8f2;
      --warning-soft: #f5f6f8;
      --radius: 12px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --measure: 70ch;
      --topbar: 58px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { color-scheme: light; scroll-behavior: smooth; }
    body {
      margin: 0;
      padding-top: 60px;
      background: var(--page);
      color: var(--ink);
      font: 16px/1.68 var(--font);
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0 0 auto;
      z-index: 2147483646;
      height: 60px;
      background: var(--page);
      border-bottom: 1px solid var(--line);
    }
    button, textarea { font: inherit; }
    button { color: inherit; }
    a { color: var(--accent); text-underline-offset: 3px; }
    ::selection { background: #dbe7ff; color: #112552; }
    :focus-visible { outline: 3px solid rgba(49, 95, 203, .28); outline-offset: 3px; }
    h1, h2, h3, p, ul, ol, blockquote { margin-top: 0; }
    h1, h2, h3 { text-wrap: balance; }
    h1 { font-size: clamp(2rem, 3.4vw, 2.8rem); line-height: 1.1; letter-spacing: -.032em; margin-bottom: 1rem; }
    h2 { font-size: clamp(1.45rem, 2.2vw, 1.85rem); line-height: 1.2; letter-spacing: -.022em; margin-bottom: .85rem; }
    h3 { font-size: 1.05rem; line-height: 1.35; margin: 2rem 0 .55rem; }
    p, li { color: var(--ink-soft); }
    p { margin-bottom: 1rem; }
    strong { color: var(--ink); font-weight: 650; }
    ul, ol { padding-left: 1.25rem; margin-bottom: 1.25rem; }
    li { margin-bottom: .55rem; }
    button { border: 0; cursor: pointer; }
    button:disabled { cursor: default; opacity: .48; }
    textarea { resize: vertical; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    .product-mark { font-size: .82rem; color: var(--muted); white-space: nowrap; }
    .product-mark strong { font-weight: 650; }
    .meta-row { display: flex; flex-wrap: wrap; gap: .5rem 1.15rem; color: var(--muted); font-size: .86rem; }
    .meta-row span { display: inline-flex; align-items: center; gap: .35rem; }
    .meta-row span + span::before { content: "·"; margin-right: .6rem; color: var(--line-strong); }
    .lesson-intro { font-size: 1.08rem; color: #354055; max-width: 64ch; }
    .quiet { color: var(--muted); }
    .rule { border: 0; border-top: 1px solid var(--line); margin: 2.5rem 0; }
    .plain-link { appearance: none; background: none; color: var(--accent); padding: .15rem 0; text-decoration: underline; text-underline-offset: 3px; }
    .plain-link:hover { color: var(--accent-hover); }

    .summary {
      margin: 1.8rem 0 2.5rem;
      padding: 1.15rem 1.25rem;
      background: var(--surface-subtle);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    .summary strong { display: block; margin-bottom: .35rem; }
    .summary p:last-child { margin-bottom: 0; }
    .key-list { list-style: none; padding: 0; margin: 1.4rem 0; border-top: 1px solid var(--line); }
    .key-list li { display: grid; grid-template-columns: minmax(9rem, 13rem) 1fr; gap: 1.5rem; padding: 1rem 0; margin: 0; border-bottom: 1px solid var(--line); }
    .key-list strong { font-size: .95rem; }
    .key-list span { color: var(--ink-soft); }
    .quote { margin: 1.6rem 0; padding: 0 0 0 1.2rem; border-left: 1px solid var(--line-strong); }
    .quote p { color: var(--ink); font-size: 1.04rem; margin-bottom: .35rem; }
    .quote cite { color: var(--muted); font-size: .83rem; font-style: normal; }

    .practice {
      margin: 1.75rem 0;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--surface);
    }
    .practice-head { display: flex; justify-content: space-between; gap: 1rem; padding: 1rem 1.15rem; background: var(--surface-subtle); border-bottom: 1px solid var(--line); }
    .practice-head strong { font-size: .98rem; }
    .practice-head span { color: var(--muted); font-size: .84rem; white-space: nowrap; }
    .practice-steps { list-style: none; padding: 0; margin: 0; }
    .practice-steps li { display: grid; grid-template-columns: 5.6rem 6.5rem 1fr; gap: 1rem; padding: 1rem 1.15rem; margin: 0; border-bottom: 1px solid var(--line); }
    .practice-steps li:last-child { border-bottom: 0; }
    .practice-steps time { color: var(--muted); font-size: .82rem; font-variant-numeric: tabular-nums; }
    .practice-steps b { color: var(--ink); font-size: .92rem; }
    .practice-steps p { margin: 0; }
    .practice-foot { padding: 1rem 1.15rem; border-top: 1px solid var(--line); background: var(--surface-subtle); }
    .practice-foot p { font-size: .9rem; margin: 0; }
    .complete-btn, .primary-btn, .secondary-btn {
      min-height: 42px;
      border-radius: 9px;
      padding: .65rem 1rem;
      font-weight: 650;
      font-size: .91rem;
    }
    .primary-btn { color: #fff; background: var(--accent); }
    .primary-btn:hover { background: var(--accent-hover); }
    .secondary-btn { color: var(--ink); background: var(--surface); border: 1px solid var(--line-strong); }
    .secondary-btn:hover { background: var(--surface-subtle); }
    .complete-btn { color: var(--accent); background: var(--accent-soft); }
    .complete-btn[data-complete="true"] { color: var(--success); background: var(--success-soft); }

    .prompt {
      margin: 1.6rem 0;
      padding: 1.15rem;
      background: var(--surface-subtle);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    .prompt label { display: block; font-weight: 650; margin-bottom: .6rem; }
    .prompt textarea { width: 100%; min-height: 96px; padding: .8rem .9rem; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--surface); color: var(--ink); }
    .prompt small { display: block; color: var(--muted); margin-top: .45rem; }
    .safety { margin: 1.6rem 0; padding: 1.2rem 1.3rem; background: var(--warning-soft); border: 1px solid var(--line); border-radius: var(--radius); }
    .safety h3 { margin-top: 0; }

    /* Variant 1: continuous reader */
    .reader-top {
      position: sticky; top: 60px; z-index: 20; height: var(--topbar);
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      padding: 0 clamp(1rem, 4vw, 2rem); background: rgba(255,255,255,.96); border-bottom: 1px solid var(--line);
    }
    .reader-progress { width: min(200px, 30vw); height: 3px; background: var(--line); overflow: hidden; border-radius: 999px; }
    .reader-progress i { display: block; width: 14%; height: 100%; background: var(--accent); }
    .reader-layout { width: min(1080px, calc(100% - 2rem)); margin: 0 auto; display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: clamp(2.5rem, 6vw, 6rem); align-items: start; }
    .reader-toc { position: sticky; top: calc(var(--topbar) + 60px + 2rem); padding-top: 4.5rem; }
    .reader-toc p { color: var(--muted); font-size: .75rem; font-weight: 650; letter-spacing: .04em; margin-bottom: .7rem; }
    .reader-toc a { display: block; color: var(--muted); font-size: .84rem; padding: .42rem 0; text-decoration: none; }
    .reader-toc a:hover { color: var(--ink); }
    .reader-article { max-width: var(--measure); padding: 4.5rem 0 9rem; }
    .reader-article header { padding-bottom: 2.5rem; border-bottom: 1px solid var(--line); margin-bottom: 4rem; }
    .reader-section { scroll-margin-top: calc(var(--topbar) + 60px + 1.5rem); padding: 0 0 3.8rem; margin-bottom: 3.8rem; border-bottom: 1px solid var(--line); }
    .reader-section:last-child { margin-bottom: 0; }

    /* Variant 2: conventional course shell */
    .course-top { height: var(--topbar); display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0 1.5rem; background: var(--surface); border-bottom: 1px solid var(--line); }
    .course-state { display: flex; align-items: center; gap: .8rem; color: var(--muted); font-size: .82rem; }
    .course-state i { display: block; width: 90px; height: 4px; border-radius: 999px; background: linear-gradient(to right, var(--accent) var(--progress), var(--line) var(--progress)); }
    .course-shell { min-height: calc(100vh - var(--topbar)); display: grid; grid-template-columns: 260px minmax(0, 1fr); }
    .course-nav { background: var(--surface-subtle); border-right: 1px solid var(--line); padding: 1.5rem 1rem 7rem; }
    .course-nav h2 { font-size: 1rem; margin: .25rem .75rem 1.2rem; letter-spacing: -.01em; }
    .course-nav button { width: 100%; display: grid; grid-template-columns: 24px 1fr; gap: .65rem; align-items: start; text-align: left; padding: .72rem .75rem; border-radius: 9px; background: transparent; color: var(--ink-soft); font-size: .88rem; }
    .course-nav button:hover { background: #eef1f5; }
    .course-nav button[aria-current="step"] { color: var(--ink); background: var(--surface); box-shadow: 0 0 0 1px var(--line); }
    .course-nav .nav-index { color: var(--muted); font-variant-numeric: tabular-nums; }
    .course-main { background: var(--surface); }
    .course-content { width: min(100% - 2rem, 760px); margin: 0 auto; padding: 4rem 0 8rem; }
    .course-content > header { margin-bottom: 2.5rem; }
    .course-content h1 { font-size: clamp(1.85rem, 3vw, 2.55rem); }
    .course-footer { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding-top: 2.5rem; margin-top: 3rem; border-top: 1px solid var(--line); }
    .course-footer .buttons { display: flex; gap: .65rem; }

    /* Variant 3: one step at a time */
    .guided-page { min-height: 100vh; background: var(--surface); }
    .guided-head { position: sticky; top: 60px; z-index: 20; background: rgba(255,255,255,.97); border-bottom: 1px solid var(--line); }
    .guided-head-inner { height: var(--topbar); width: min(100% - 2rem, 920px); margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .guided-track { width: min(100% - 2rem, 920px); margin: 0 auto; display: grid; grid-template-columns: repeat(7, 1fr); gap: .35rem; padding-bottom: .65rem; }
    .guided-track button { position: relative; height: 44px; margin: -20px 0; background: transparent; }
    .guided-track button::before { content: ""; position: absolute; inset: 20px 0; border-radius: 999px; background: var(--line); }
    .guided-track button[data-past="true"]::before, .guided-track button[aria-current="step"]::before { background: var(--accent); }
    .guided-main { width: min(100% - 2rem, 820px); margin: 0 auto; padding: clamp(3rem, 7vw, 6rem) 0 8rem; }
    .guided-label { color: var(--muted); font-size: .85rem; margin-bottom: 1rem; }
    .guided-main h1 { max-width: 16ch; }
    .guided-main .lesson-intro { margin-bottom: 2.4rem; }
    .guided-body { max-width: var(--measure); }
    .guided-actions { position: sticky; bottom: 0; z-index: 10; border-top: 1px solid var(--line); background: rgba(255,255,255,.97); }
    .guided-actions-inner { width: min(100% - 2rem, 820px); margin: 0 auto; min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .guided-actions span { color: var(--muted); font-size: .85rem; }
    .guided-actions .buttons { display: flex; gap: .65rem; }

    @media (max-width: 820px) {
      .reader-layout { display: block; width: min(100% - 2rem, 720px); }
      .reader-toc { position: static; padding: 1rem 0 0; display: flex; gap: .4rem; overflow-x: auto; scrollbar-width: none; }
      .reader-toc p { display: none; }
      .reader-toc a { white-space: nowrap; padding: .5rem .7rem; border: 1px solid var(--line); border-radius: 8px; }
      .reader-article { padding-top: 2.5rem; }
      .course-shell { display: block; }
      .course-nav { position: sticky; top: 60px; z-index: 15; display: flex; overflow-x: auto; gap: .35rem; padding: .65rem .75rem; border-right: 0; border-bottom: 1px solid var(--line); scrollbar-width: none; }
      .course-nav h2 { display: none; }
      .course-nav button { width: auto; min-height: 44px; flex: 0 0 auto; display: block; padding: .55rem .75rem; white-space: nowrap; }
      .course-nav .nav-index { display: none; }
      .course-content { padding-top: 2.8rem; }
    }
    @media (max-width: 620px) {
      body { font-size: 15.5px; }
      h1 { font-size: 2rem; }
      .product-mark span { display: none; }
      .meta-row span + span::before { display: none; }
      .key-list li { display: block; }
      .key-list strong { display: block; margin-bottom: .3rem; }
      .practice-head, .course-footer, .guided-actions-inner { align-items: flex-start; }
      .practice-steps li { grid-template-columns: 4.8rem 1fr; gap: .35rem .8rem; }
      .practice-steps p { grid-column: 1 / -1; }
      .course-top { padding: 0 1rem; }
      .course-state span { display: none; }
      .course-content { width: min(100% - 2rem, 760px); }
      .course-footer, .guided-actions-inner { flex-direction: column; justify-content: center; padding: .8rem 0; }
      .course-footer .buttons, .guided-actions .buttons { width: 100%; }
      .course-footer button, .guided-actions button { flex: 1; }
      .guided-main { padding-top: 3rem; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

    /* Prototype picker — specified by the Prototype skill. */
    .proto-picker {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2147483647;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(10, 10, 10, 0.82);
      -webkit-backdrop-filter: blur(12px) saturate(1.4);
      backdrop-filter: blur(12px) saturate(1.4);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08) inset,
        0 8px 24px rgba(0, 0, 0, 0.24),
        0 2px 6px rgba(0, 0, 0, 0.12);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }

    .proto-picker-highlight {
      position: absolute;
      top: 4px;
      left: 0;
      height: 28px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      will-change: transform;
    }

    .proto-picker[data-ready] .proto-picker-highlight {
      transition:
        transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
        width 250ms cubic-bezier(0.23, 1, 0.32, 1);
    }

    @media (prefers-reduced-motion: reduce) {
      .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
    }

    .proto-picker-item {
      position: relative;
      display: flex;
      align-items: center;
      height: 28px;
      padding: 0 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: rgba(255, 255, 255, 0.55);
      font: inherit;
      cursor: pointer;
      transition: color 150ms ease-out;
    }

    .proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
    .proto-picker-item:active { transform: scale(0.97); }
    .proto-picker-item:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px; }
    .proto-picker-item[data-active] { color: #fff; }

    .proto-picker[data-position="top"] {
      bottom: auto;
      top: 24px;
    }

    @media (max-width: 520px) {
      .proto-picker[data-position="top"] { top: 12px; }
      .proto-picker-item { padding: 0 9px; }
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div class="sr-only" id="lessonStatus" aria-live="polite"></div>

  <nav class="proto-picker" data-position="top" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">Reader</button>
    <button class="proto-picker-item">Course lesson</button>
    <button class="proto-picker-item">Guided lesson</button>
  </nav>

  <script>
    const sections = [
      {
        id: 'start',
        nav: 'Start here',
        title: 'Meeting Self through awareness',
        intro: 'Week 1 begins with one small distinction: attention is not the same as awareness. You will test that difference directly and begin to notice what access to Self may feel like for you.',
        body: `
          <div class="meta-row"><span>Week 1 of 6</span><span>About 25 minutes</span><span>One 7-minute practice</span></div>
          <div class="summary"><strong>By the end of this week</strong><p>You can feel the difference between attention and awareness, and you are beginning to recognise what access to Self — awake awareness — feels like for you.</p></div>
          <h3>What to do first</h3>
          <p>Read this lesson once without trying any of the practices. Then choose an uninterrupted seven minutes and try the core practice. That is enough to begin.</p>
          <p>If time is short, do the seven-minute practice three times this week and leave everything else. <strong>Frequency matters more than volume.</strong></p>
          <h3>The larger journey</h3>
          <p>Most of us try to improve life with the equipment we already use: think harder, plan better, focus longer, get on top of it. That equipment is useful. It also has a ceiling. This course explores another capacity already present in the background: the wider awareness in which all focusing happens.</p>
          <blockquote class="quote"><p>“What we're doing is bringing something that's already present, but in the background, into the foreground.”</p><cite>Guthrie Sayen</cite></blockquote>
          <p>Guthrie sometimes describes this as moving from a thought-based operating system toward an awareness-based one. Focus does not disappear. It becomes a precise tool held inside a wider field.</p>
        `
      },
      {
        id: 'ifs',
        nav: 'IFS in plain language',
        title: 'IFS in plain language',
        intro: 'Internal Family Systems offers a non-pathologising way to understand the different voices, reactions and intentions inside a person.',
        body: `
          <p>IFS was developed in the 1980s by the American family therapist Richard Schwartz. Trained to see families as systems, he kept hearing people describe their inner life in similar terms: one part of me wants this; another part will not allow it. He began applying systems thinking inside a single person.</p>
          <h3>The mind is naturally multiple</h3>
          <p>The part that wants to rest and the part that wants to finish are not evidence of a fault. Different inner positions are part of ordinary human experience.</p>
          <h3>Parts are not defects</h3>
          <p>A part may drive too hard, avoid, criticise or go numb. In IFS, that behaviour is a role rather than an identity. Even costly strategies usually began as an attempt to help, protect or prevent something.</p>
          <h3>Self does not have to be built</h3>
          <p>IFS holds that everyone has a core capacity that is whole, clear and able to relate without force. In this course, following Guthrie, we will meet Self primarily as <strong>awake awareness</strong>: the living capacity that can notice, include and relate.</p>
          <div class="summary"><strong>What this course is — and is not</strong><p>IFS is a psychotherapy model. This course uses its educational and personal-development layer. It is not psychotherapy, practitioner training or an invitation to conduct inner work for another person.</p></div>
        `
      },
      {
        id: 'guthrie',
        nav: 'Guthrie’s approach',
        title: 'How Guthrie teaches',
        intro: 'The course is not only an explanation of IFS. Its centre is the quality of presence Guthrie brings to the material and to the people in the room.',
        body: `
          <p>Guthrie Sayen, PhD, PCC, is a Level 3-trained IFS practitioner. He co-created and co-led <em>Coaching for Self-Leadership</em> through the IFS Institute for more than a thousand participants and has studied extensively with Richard Schwartz.</p>
          <ul class="key-list">
            <li><strong>Experience before explanation</strong><span>Practice comes first; language is offered afterwards to name something you have already felt.</span></li>
            <li><strong>Access, not perfection</strong><span>The question is not whether you are “in Self”. It is how much access to Self may be available now.</span></li>
            <li><strong>No pressure to go deeper</strong><span>Force is not the method. Nothing here requires you to open something you are not ready to open.</span></li>
          </ul>
          <p>During the live calls, notice not only what Guthrie says but how he listens: unhurried, interested and without trying to make another person change. That quality of attention is part of the teaching.</p>
        `
      },
      {
        id: 'distinctions',
        nav: 'Core distinctions',
        title: 'The distinctions for this week',
        intro: 'These are not definitions to memorise. They are simple language for something you can test in direct experience.',
        body: `
          <ul class="key-list">
            <li><strong>Attention is focus</strong><span>It selects one thing and holds it. This precision is useful, and it necessarily excludes.</span></li>
            <li><strong>Awareness is field</strong><span>It can include body, sound, space, mood and task at the same time.</span></li>
            <li><strong>Focus is sequential</strong><span>Attention usually moves from one thing to the next. Awareness can include several streams in parallel.</span></li>
            <li><strong>Self is awake awareness</strong><span>Not a detached observer, but the living capacity that can notice and relate.</span></li>
            <li><strong>Parts can be noticed</strong><span>Thoughts, impulses, reactions and inner voices can appear within awareness.</span></li>
            <li><strong>Access is a continuum</strong><span>A little curiosity or one second of pause can already be meaningful. There is no performance state to achieve.</span></li>
            <li><strong>Language can make space</strong><span>“A part of me is rushing” leaves more relationship than “I am rushing”.</span></li>
          </ul>
          <blockquote class="quote"><p>“Parts are really cool, because by noticing a part we're taking the first step to recovering access to Self.”</p><cite>Guthrie Sayen</cite></blockquote>
        `
      },
      {
        id: 'practice',
        nav: 'Core practice',
        title: 'Ground, core, field, focus',
        intro: 'This seven-minute practice is the centre of Week 1. The order matters: support first, then embodiment, then the wider field, and only then precise focus.',
        body: `
          <div class="practice">
            <div class="practice-head"><strong>Core practice</strong><span>About 7 minutes</span></div>
            <ol class="practice-steps">
              <li><time>0:00–0:45</time><b>Arrive</b><p>Sit upright and comfortable. Let the spine support you without becoming rigid. Nothing has to be achieved.</p></li>
              <li><time>0:45–2:00</time><b>Ground</b><p>Feel your feet on the floor and your body meeting the seat. Let gravity carry what it can carry.</p></li>
              <li><time>2:00–3:15</time><b>Core</b><p>Bring light attention to the trunk: belly, chest, back and throat. Feel from the inside without changing anything.</p></li>
              <li><time>3:15–5:00</time><b>Field</b><p>Open awareness into the room. Include sound, peripheral vision and the body together. Thoughts do not have to leave.</p></li>
              <li><time>5:00–6:10</time><b>Focus</b><p>Let attention lightly touch one simple thing while ground, core and field remain present.</p></li>
              <li><time>6:10–7:00</time><b>Return</b><p>Notice how much access to Self may be available: none you can identify, a little, or more. Finish: “Access to Self may feel like…”</p></li>
            </ol>
            <div class="practice-foot"><p>Eyes may close or rest in a soft gaze. Every invitation is optional. If you feel strain or disorientation, open your eyes, orient to the room and stop.</p></div>
          </div>
          <button class="complete-btn" data-action="practice-complete" aria-pressed="false" type="button">Mark practice as complete</button>
          <h3>One doorway into parts</h3>
          <p>Choose an ordinary, low-intensity reaction. Say: “A part of me is rushing,” “A part of me is distracted,” or “A part of me wants to get this right.” Notice whether the sentence creates even one percent more space. Then ask only: <em>“Am I willing to be with this part for one breath?”</em></p>
          <p>Yes and no are both complete answers. Do not look for memories, origins or explanations, and do not ask the part to change.</p>
        `
      },
      {
        id: 'week',
        nav: 'During the week',
        title: 'Bring it into ordinary life',
        intro: 'Short returns build recognition. One invitation a day is plenty, and repeating the one that helps most is better than completing a list.',
        body: `
          <ol>
            <li><strong>Day 1:</strong> Do the seven-minute practice. Finish: “Access to Self may feel like…”</li>
            <li><strong>Day 2:</strong> Soften the eyes and include peripheral vision twice: once calm, once busy.</li>
            <li><strong>Day 3:</strong> Walk with open seeing, then hearing, then body, then all three.</li>
            <li><strong>Day 4:</strong> Use “A part of me…” once during the day. Notice whether any space appears.</li>
            <li><strong>Day 5:</strong> During one task, let focus become lighter while the room stays present.</li>
            <li><strong>Day 6:</strong> Notice what helped access appear and what helped it last a little longer.</li>
            <li><strong>Day 7:</strong> Write three markers of more access, two supports and one question for the call.</li>
          </ol>
          <div class="prompt">
            <label for="week-note">Your personal compass</label>
            <textarea id="week-note" data-note placeholder="Access to Self may feel like…\nLess access may feel like…\nWhat supports a little more access is…"></textarea>
            <small>Your note is saved in this browser while you compare the prototypes.</small>
          </div>
          <h3>Before the live call</h3>
          <p>Come having tried the practice at least once. Bring one question about direct experience: what happened, what did not happen, or what confused you. You never have to speak or share personal history. We do ask participants to keep cameras on during the live session to support the shared field; if that is not possible for you, contact the course team before the call.</p>
        `
      },
      {
        id: 'support',
        nav: 'Boundaries & glossary',
        title: 'Boundaries, support and key words',
        intro: 'The boundary is part of the method: Week 1 is about recognition, not depth work.',
        body: `
          <div class="safety">
            <h3>If a practice becomes too much</h3>
            <ol>
              <li>Stop. You do not need a reason.</li>
              <li>Open your eyes and name five things you can see.</li>
              <li>Feel your feet and the support beneath you.</li>
              <li>Stand, move, drink water or leave the material for the day.</li>
              <li>Contact someone you trust if support would help.</li>
            </ol>
            <p>This course is educational. It is not psychotherapy, crisis care or a substitute for individual support.</p>
          </div>
          <h3>What Week 1 does not include</h3>
          <ul>
            <li>No guiding another person through an inner process.</li>
            <li>No searching for origins, memories or causes.</li>
            <li>No work with young, hurt or vulnerable parts between participants.</li>
            <li>No pressure to go deeper, share or produce an experience.</li>
          </ul>
          <h3>Key words</h3>
          <ul class="key-list">
            <li><strong>Attention</strong><span>Selective focus on one thing.</span></li>
            <li><strong>Awareness</strong><span>The wider field in which experience appears.</span></li>
            <li><strong>Self</strong><span>The innate capacity for awake, relational awareness.</span></li>
            <li><strong>Part</strong><span>An inner position with its own feeling, view or protective intention.</span></li>
            <li><strong>Access to Self</strong><span>A continuum, not a pass-or-fail state.</span></li>
          </ul>
        `
      }
    ];

    const state = {
      section: [0, 0, 0],
      practiceComplete: localStorage.getItem('week1-practice-complete') === 'true',
      note: localStorage.getItem('week1-personal-compass') || ''
    };
    let focusAfterMount = false;

    function articleContent(section) {
      return `<h1>${section.title}</h1><p class="lesson-intro">${section.intro}</p><div class="lesson-copy">${section.body}</div>`;
    }

    function renderReader() {
      const toc = sections.map(s => `<a href="#reader-${s.id}">${s.nav}</a>`).join('');
      const content = sections.map((s, i) => `
        <section class="reader-section" id="reader-${s.id}">
          ${i === 0 ? `<header>${articleContent(s)}</header>` : articleContent(s)}
        </section>`).join('');
      return `
        <div class="reader-view">
          <header class="reader-top">
            <div class="product-mark"><strong>The Centrality of Self</strong><span> · Week 1</span></div>
            <div class="reader-progress" role="progressbar" aria-label="Lesson progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>
          </header>
          <div class="reader-layout">
            <nav class="reader-toc" aria-label="Lesson contents"><p>In this lesson</p>${toc}</nav>
            <main class="reader-article">${content}</main>
          </div>
        </div>`;
    }

    function renderCourse() {
      const i = state.section[1];
      const s = sections[i];
      const nav = sections.map((item, j) => `
        <button type="button" data-section="${j}" ${j === i ? 'aria-current="step"' : ''}>
          <span class="nav-index">${String(j + 1).padStart(2, '0')}</span><span>${item.nav}</span>
        </button>`).join('');
      return `
        <div class="course-view">
          <header class="course-top">
            <div class="product-mark"><strong>The Centrality of Self</strong><span> · Week 1</span></div>
            <div class="course-state"><span>${i + 1} of ${sections.length}</span><i style="--progress:${((i + 1) / sections.length) * 100}%"></i></div>
          </header>
          <div class="course-shell">
            <nav class="course-nav" aria-label="Week 1 lessons"><h2>Week 1</h2>${nav}</nav>
            <main class="course-main"><article class="course-content">
              <header><div class="meta-row"><span>Lesson ${i + 1}</span><span>${i === 4 ? '10 minutes' : '4–6 minutes'}</span></div></header>
              ${articleContent(s)}
              <footer class="course-footer">
                <span class="quiet">Lesson ${i + 1} of ${sections.length}</span>
                <div class="buttons">
                  <button class="secondary-btn" type="button" data-step="prev" ${i === 0 ? 'disabled' : ''}>Previous</button>
                  <button class="primary-btn" type="button" data-step="next" ${i === sections.length - 1 ? 'disabled' : ''}>Continue</button>
                </div>
              </footer>
            </article></main>
          </div>
        </div>`;
    }

    function renderGuided() {
      const i = state.section[2];
      const s = sections[i];
      const track = sections.map((item, j) => `<button type="button" data-section="${j}" aria-label="Open ${item.nav}" ${j === i ? 'aria-current="step"' : ''} data-past="${j < i}"></button>`).join('');
      return `
        <div class="guided-page">
          <header class="guided-head">
            <div class="guided-head-inner"><div class="product-mark"><strong>The Centrality of Self</strong><span> · Week 1</span></div><span class="quiet">${i + 1} / ${sections.length}</span></div>
            <nav class="guided-track" aria-label="Lesson steps">${track}</nav>
          </header>
          <main class="guided-main">
            <div class="guided-label">${s.nav} · ${i === 4 ? 'about 10 minutes' : 'about 5 minutes'}</div>
            <article class="guided-body">${articleContent(s)}</article>
          </main>
          <footer class="guided-actions"><div class="guided-actions-inner">
            <span>${i === sections.length - 1 ? 'Week 1 complete' : `Next: ${sections[i + 1].nav}`}</span>
            <div class="buttons"><button class="secondary-btn" type="button" data-step="prev" ${i === 0 ? 'disabled' : ''}>Back</button><button class="primary-btn" type="button" data-step="next" ${i === sections.length - 1 ? 'disabled' : ''}>Next</button></div>
          </div></footer>
        </div>`;
    }

    const variants = [renderReader, renderCourse, renderGuided];
    const stage = document.getElementById('stage');
    const picker = document.querySelector('.proto-picker');
    const highlight = picker.querySelector('.proto-picker-highlight');
    const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
    const replay = picker.querySelector('.proto-picker-replay');
    let current = 0;

    function moveHighlight() {
      const el = items[current];
      highlight.style.width = el.offsetWidth + 'px';
      highlight.style.transform = `translateX(${el.offsetLeft}px)`;
    }

    function syncFields() {
      stage.querySelectorAll('[data-action="practice-complete"]').forEach(button => {
        button.dataset.complete = String(state.practiceComplete);
        button.setAttribute('aria-pressed', String(state.practiceComplete));
        button.textContent = state.practiceComplete ? 'Practice complete' : 'Mark practice as complete';
      });
      stage.querySelectorAll('[data-note]').forEach(field => { field.value = state.note; });
    }

    function attachInteractions() {
      stage.querySelectorAll('[data-section]').forEach(button => button.addEventListener('click', () => {
        state.section[current] = Number(button.dataset.section);
        focusAfterMount = true;
        mount(current);
        window.scrollTo(0, 0);
      }));
      stage.querySelectorAll('[data-step]').forEach(button => button.addEventListener('click', () => {
        const delta = button.dataset.step === 'next' ? 1 : -1;
        state.section[current] = Math.max(0, Math.min(sections.length - 1, state.section[current] + delta));
        focusAfterMount = true;
        mount(current);
        window.scrollTo(0, 0);
      }));
      stage.querySelectorAll('[data-action="practice-complete"]').forEach(button => button.addEventListener('click', () => {
        state.practiceComplete = !state.practiceComplete;
        localStorage.setItem('week1-practice-complete', String(state.practiceComplete));
        syncFields();
      }));
      stage.querySelectorAll('[data-note]').forEach(field => field.addEventListener('input', () => {
        state.note = field.value;
        localStorage.setItem('week1-personal-compass', state.note);
      }));
      syncFields();
      updateReaderProgress();
    }

    function updateReaderProgress() {
      const bar = stage.querySelector('.reader-progress i');
      if (!bar) return;
      const max = document.documentElement.scrollHeight - innerHeight;
      const value = max > 0 ? Math.min(100, Math.max(0, (scrollY / max) * 100)) : 100;
      bar.style.width = value + '%';
      bar.parentElement.setAttribute('aria-valuenow', String(Math.round(value)));
      const anchors = [...stage.querySelectorAll('.reader-toc a')];
      const chapterSections = [...stage.querySelectorAll('.reader-section')];
      let active = 0;
      chapterSections.forEach((section, index) => {
        if (section.getBoundingClientRect().top <= 180) active = index;
      });
      anchors.forEach((anchor, index) => {
        if (index === active) anchor.setAttribute('aria-current', 'location');
        else anchor.removeAttribute('aria-current');
      });
    }

    function mount(i) {
      stage.innerHTML = '';
      requestAnimationFrame(() => {
        stage.innerHTML = variants[i]();
        attachInteractions();
        if (focusAfterMount && i > 0) {
          const heading = stage.querySelector('main h1');
          if (heading) {
            heading.setAttribute('tabindex', '-1');
            heading.focus({ preventScroll: true });
          }
          document.getElementById('lessonStatus').textContent = `Lesson ${state.section[i] + 1} of ${sections.length}: ${sections[state.section[i]].nav}`;
          focusAfterMount = false;
        }
      });
    }

    function setActive(i) {
      if (i < 0 || i >= variants.length) return;
      current = i;
      document.body.dataset.variant = i === 0 ? 'reader' : i === 1 ? 'course' : 'guided';
      items.forEach((el, j) => {
        el.toggleAttribute('data-active', j === i);
        if (j === i) el.setAttribute('aria-current', 'true');
        else el.removeAttribute('aria-current');
      });
      moveHighlight();
      const url = new URL(location);
      url.searchParams.set('v', i + 1);
      history.replaceState(null, '', url);
      mount(i);
    }

    items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
    replay?.addEventListener('click', () => mount(current));
    window.addEventListener('resize', moveHighlight);
    window.addEventListener('scroll', updateReaderProgress, { passive: true });

    document.addEventListener('keydown', (e) => {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const num = parseInt(e.key, 10);
      if (num >= 1 && num <= variants.length) setActive(num - 1);
      else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
      else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
      else if (e.key === 'r' || e.key === 'R') mount(current);
    });

    setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
    requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
  </script>
</body>
</html>
